[server]
headless = true
enableStaticServing = false
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 50
runOnSave = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[theme]
base = "dark"
primaryColor = "#4da3ff"
backgroundColor = "#0e131a"
secondaryBackgroundColor = "#151c26"
textColor = "#e8edf3"
